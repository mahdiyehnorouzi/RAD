services:
  - type: web
    name: rad-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # No migrations yet: schema sync is the only way tables get created or updated.
      - key: TYPEORM_SYNCHRONIZE
        value: "true"
      # Re-seeding overwrites admin edits to registry works; set true only for the first boot on an empty database.
      - key: RUN_SEED
        value: "false"
      - key: ADMIN_ORIGIN
        value: https://rad-admin.rad-studio.workers.dev
      - key: STOREFRONT_ORIGIN
        value: https://rad-studio.rad-studio.workers.dev
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rad-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: rad-db
    plan: free
    databaseName: rad
    user: rad
