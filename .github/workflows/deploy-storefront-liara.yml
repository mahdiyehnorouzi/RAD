name: Deploy Storefront (Liara)

# Liara's own remote Docker build (`liara deploy` building the Dockerfile
# on Liara's builder) timed out at 20 minutes on this monorepo. Instead:
# build the image here on a GitHub-hosted amd64 runner, push it to GHCR,
# and have Liara just pull + run the prebuilt image (no build on Liara's
# side at all). See docs/liara-migration.md for the full writeup.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-storefront-liara.yml"

concurrency:
  group: deploy-storefront-liara
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rad-storefront

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-image:
    name: Build & push image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.tags.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: echo "ref=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_* are inlined into the client bundle at build time, so
      # they must be passed as build args here, not as runtime env vars.
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://rad-object.com' }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Gated on workflow_dispatch only — pushing to main builds and publishes
  # the image (harmless, no production effect) but never deploys on its
  # own. A human has to trigger this job explicitly from the Actions tab.
  deploy:
    name: Deploy to Liara
    needs: build-image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secret
        env:
          HAS_LIARA: ${{ secrets.LIARA_API_TOKEN != '' }}
        run: |
          if [[ "${HAS_LIARA}" != "true" ]]; then
            echo "::error::LIARA_API_TOKEN is missing. Add it as a Repository secret."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy storefront image to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: bash scripts/deploy-storefront-liara.sh
