name: Agent Skill Mirrors

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-mirrors:
    name: Agent skill mirrors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify RAD-owned skills and mirrors
        run: node scripts/check-agent-skill-mirrors.cjs
