# Only reusable/explicit manual invocations; deploy.yml remains the automatic entry.
name: Frontend VPS release
on:
  workflow_call:
    inputs:
      deploy_storefront:
        required: true
        type: boolean
      deploy_admin:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      operation:
        description: "Build only, or build and release this main commit"
        type: choice
        options: [build, deploy]
        default: build
      deploy_storefront:
        type: boolean
        default: true
      deploy_admin:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml
  build-images:
    needs: checks
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.deploy_storefront || inputs.deploy_admin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse a stale main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/mahdiyehnorouzi/RAD/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: inputs.deploy_storefront
        id: storefront
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mahdiyehnorouzi/rad-storefront:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.rad-object.com' }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          cache-from: type=gha,scope=storefront-vps
          cache-to: type=gha,mode=max,scope=storefront-vps
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: inputs.deploy_admin
        id: admin
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mahdiyehnorouzi/rad-admin:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=admin-vps
          cache-to: type=gha,mode=max,scope=admin-vps
      - name: Sign the selected services and exact registry digests
        env:
          RELEASE_KIND: frontend
          STOREFRONT_DIGEST: ${{ steps.storefront.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
        run: python3 scripts/production/make-manifest.py
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        id: attest
        with:
          subject-path: release.json
      - run: cp "$BUNDLE" release.sigstore.json
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release.json
            release.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build-images
    if: vars.RAD_SELF_HOSTED_RELEASE_ENABLED == 'true' && github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.deploy_storefront || inputs.deploy_admin) && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    runs-on: [self-hosted, Linux, X64, rad-production]
    timeout-minutes: 20
    environment: production-frontend-vps
    permissions:
      contents: read
      actions: read
    concurrency:
      group: rad-production-release
      cancel-in-progress: false
    steps:
      # Deliberately no checkout, setup-node, shell from artifacts, SSH or Docker.
      - name: Allocate incoming data directory
        id: stage
        run: |
          set -euo pipefail
          stage=$(mktemp -d /var/lib/rad-release/incoming/release-XXXXXXXXXXXX)
          echo "path=$stage" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.stage.outputs.path }}
      - name: Invoke installed root-owned verifier and release broker
        env:
          STAGE: ${{ steps.stage.outputs.path }}
          RELEASE_KIND: frontend
        run: |
          set -euo pipefail
          # Only fixed-format data crosses the privilege boundary. The root-owned
          # broker independently verifies the signed manifest, source SHA/ref,
          # hosted builder, run identity, payload digest and allowed operations.
          python3 - <<'PY_REQUEST' | sudo -n /usr/local/sbin/rad-release
          import json, os
          print(json.dumps(dict(stage=os.path.basename(os.environ["STAGE"]),
            kind=os.environ["RELEASE_KIND"], commit=os.environ["GITHUB_SHA"],
            run_id=int(os.environ["GITHUB_RUN_ID"]), run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]))))
          PY_REQUEST
      - name: Remove incoming data
        if: always() && steps.stage.outcome == 'success'
        env:
          STAGE: ${{ steps.stage.outputs.path }}
        run: |
          case "$STAGE" in /var/lib/rad-release/incoming/release-*) rm -rf -- "$STAGE" ;; *) exit 1 ;; esac

  verify-outcome:
    needs: [checks, build-images, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          TRUSTED: ${{ github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          SELECTED: ${{ inputs.deploy_storefront || inputs.deploy_admin }}
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build-images.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          test "$TRUSTED" = true
          test "$SELECTED" = true
          test "$CHECKS" = success
          test "$BUILD" = success
          if test "$REQUESTED" = true; then test "$RELEASE" = success; fi
