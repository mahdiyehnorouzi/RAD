# Only reusable/explicit manual invocations; deploy.yml remains the automatic entry.
#
# Release transport: see the matching comment in deploy-api-vps.yml -
# GitHub-hosted `ubuntu-latest` over the RAD tailnet (OIDC, no self-hosted
# runner) to the narrowly-restricted `rad-deploy` account, which hands the
# signed release manifest to the unchanged root-owned broker
# (scripts/production/rad_release.py). Image digests are the release
# payload here, not a tarball - no code or build output is streamed to the
# VPS for the frontend path, only the signed manifest naming the exact GHCR
# digests to pull.
name: Frontend VPS release
on:
  workflow_call:
    inputs:
      deploy_storefront:
        required: true
        type: boolean
      deploy_admin:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      operation:
        description: "Build only, or build and release this main commit"
        type: choice
        options: [build, deploy]
        default: build
      deploy_storefront:
        type: boolean
        default: true
      deploy_admin:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml
  build-images:
    needs: checks
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.deploy_storefront || inputs.deploy_admin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse a stale main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/mahdiyehnorouzi/RAD/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: inputs.deploy_storefront
        id: storefront
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mahdiyehnorouzi/rad-storefront:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.rad-object.com' }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          cache-from: type=gha,scope=storefront-vps
          cache-to: type=gha,mode=max,scope=storefront-vps
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: inputs.deploy_admin
        id: admin
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mahdiyehnorouzi/rad-admin:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=admin-vps
          cache-to: type=gha,mode=max,scope=admin-vps
      - name: Sign the selected services and exact registry digests
        env:
          RELEASE_KIND: frontend
          STOREFRONT_DIGEST: ${{ steps.storefront.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
        run: python3 scripts/production/make-manifest.py
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        id: attest
        with:
          subject-path: release.json
      - run: cp "$BUNDLE" release.sigstore.json
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release.json
            release.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build-images
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.deploy_storefront || inputs.deploy_admin) && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-frontend-vps
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: rad-production-release
      cancel-in-progress: false
    env:
      RAD_VPS_TAILSCALE_IP: "100.103.104.79"
    steps:
      - name: Download signed artifact (this exact run/attempt only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-release-${{ github.sha }}-${{ github.run_attempt }}
          path: stage

      - name: Connect to RAD tailnet using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:rad-deploy

      - name: Configure pinned SSH identity for the restricted rad-deploy account
        env:
          SSH_KEY: ${{ secrets.RAD_DEPLOY_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.RAD_VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$HOST_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s %s\n' "$RAD_VPS_TAILSCALE_IP" "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      # Same forced-command rad-deploy account and unchanged root broker as the
      # API path (see deploy-api-vps.yml) - only the payload differs: no tarball,
      # just the signed manifest naming the exact GHCR image digests to release.
      - name: Ship manifest and trigger release over the tailnet
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          tar -cf - -C stage release.json release.sigstore.json \
            | ssh "${ssh_args[@]}" "rad-deploy@${RAD_VPS_TAILSCALE_IP}" \
              "deploy kind=frontend commit=${GITHUB_SHA} run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT}"

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  verify-outcome:
    needs: [checks, build-images, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          TRUSTED: ${{ github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          SELECTED: ${{ inputs.deploy_storefront || inputs.deploy_admin }}
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build-images.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          test "$TRUSTED" = true
          test "$SELECTED" = true
          test "$CHECKS" = success
          test "$BUILD" = success
          if test "$REQUESTED" = true; then test "$RELEASE" = success; fi
