# Builds storefront + admin images on GitHub Actions (same pattern as the
# existing deploy-storefront-liara.yml / deploy-admin-liara.yml: Liara's own
# remote Docker build timed out on this monorepo) and deploys them to the
# VPS via Docker Compose.
#
# This workflow is additive — it does not touch, replace, or race with the
# existing Liara workflows. Both can run; only one should ever be the live
# DNS target at a time (see docs/vps-frontend-deployment-plan.md).
#
# Three ways in:
#   - push to main (automatic, normal path, BUILD ONLY) — builds+pushes
#     both images (cheap, cached, and keeps every main commit's images
#     available in GHCR even if that commit only touched one app) but
#     never deploys by itself.
#   - workflow_call from deploy.yml — deploy.yml is what actually decides
#     to deploy and calls this workflow with explicit deploy_storefront/
#     deploy_admin inputs, for a push that touched the frontend.
#   - workflow_dispatch — manual emergency path only (redeploy a specific
#     already-built tag, or force both services when you're not sure
#     what changed). Still requires choosing build-only vs deploy.
#
# IMPORTANT: `github.event_name` inside a reusable (workflow_call) run is
# NOT "workflow_call" — it's inherited from whatever triggered the
# TOP-LEVEL caller. Since deploy.yml's own trigger is `push`, a run of
# THIS workflow reached via workflow_call reports `github.event_name ==
# 'push'` — identical to a direct push straight to this workflow's own
# `push:` trigger above. Event name alone cannot tell those two apart, so
# `should-deploy` below keys off whether `inputs.deploy_storefront`/
# `deploy_admin` are actually present instead: a bare `push` event (the
# build-only path) carries NO `inputs` context at all (that trigger type
# declares none), so they read as empty/false there, while workflow_call
# declares them `required: true` — always real booleans when that path is
# taken. This is the one reliable signal; never add an `== 'workflow_call'`
# check back in.
#
# See docs/cicd-pipeline.md for the production-frontend-vps environment's
# required protection-rule shape for the automatic path to be hands-off.
#
# The `release` job runs on the dedicated `rad-production` SELF-HOSTED
# runner (not ubuntu-latest) — it lives on the VPS itself, so no inbound SSH
# is needed at all. `build-images` still runs on ubuntu-latest, as does
# every PR/CI job — untrusted PR code never runs on `rad-production`. See
# infra/rad-production-runner/README.md for the required one-time VPS setup.

name: Frontend VPS release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Build+push only, or also deploy to the VPS"
        type: choice
        options: [build, deploy]
        default: build
      deploy_storefront:
        description: "Recreate the storefront container"
        type: boolean
        default: true
      deploy_admin:
        description: "Recreate the admin container"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.frontend-vps.yml"
      - ".github/workflows/deploy-frontend-vps.yml"
  workflow_call:
    inputs:
      deploy_storefront:
        description: "Recreate the storefront container"
        required: true
        type: boolean
      deploy_admin:
        description: "Recreate the admin container"
        required: true
        type: boolean

concurrency:
  group: rad-frontend-vps-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # See the file-level note above on why this can't use
  # `github.event_name == 'workflow_call'`. Computed once here and reused
  # by release/verify-outcome so the "should we deploy, and what" decision
  # exists in exactly one place.
  should-deploy:
    name: Determine whether and what to deploy
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      storefront: ${{ steps.decide.outputs.storefront }}
      admin: ${{ steps.decide.outputs.admin }}
      any: ${{ steps.decide.outputs.any }}
    steps:
      - id: decide
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            storefront="${{ inputs.operation == 'deploy' && inputs.deploy_storefront == true }}"
            admin="${{ inputs.operation == 'deploy' && inputs.deploy_admin == true }}"
          else
            # Reached via a bare push (build-only — inputs is empty, both
            # read false below) or via workflow_call from deploy.yml
            # (inputs are real, required booleans).
            storefront="${{ inputs.deploy_storefront == true }}"
            admin="${{ inputs.deploy_admin == true }}"
          fi
          any=false
          [[ "$storefront" == "true" || "$admin" == "true" ]] && any=true
          echo "storefront=${storefront}" >> "$GITHUB_OUTPUT"
          echo "admin=${admin}" >> "$GITHUB_OUTPUT"
          echo "any=${any}" >> "$GITHUB_OUTPUT"
          echo "storefront=${storefront} admin=${admin} any=${any}"

  build-images:
    name: Build & push storefront + admin images
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # required by actions/attest-build-provenance
      attestations: write  # required to publish the build-provenance attestation
    outputs:
      storefront_tag: ${{ github.sha }}
      admin_tag: ${{ github.sha }}
      # Digest-pinned references — what the release job actually deploys.
      # A tag (even the commit-SHA tag) can in principle be repushed to
      # point at different bytes later; the digest cannot. This is the
      # "validate image provenance before release" boundary: the release
      # job never trusts "whatever :<sha> currently resolves to in GHCR",
      # it deploys exactly the digest this build produced, after
      # independently re-verifying that digest's attestation.
      storefront_ref: ${{ steps.storefront_build.outputs.digest && format('ghcr.io/{0}/rad-storefront@{1}', github.repository_owner, steps.storefront_build.outputs.digest) }}
      admin_ref: ${{ steps.admin_build.outputs.digest && format('ghcr.io/{0}/rad-admin@{1}', github.repository_owner, steps.admin_build.outputs.digest) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined into the client bundle at build time.
      - name: Build and push storefront (linux/amd64)
        id: storefront_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rad-storefront:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rad-storefront:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.rad-object.com' }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          cache-from: type=gha,scope=storefront-vps
          cache-to: type=gha,mode=max,scope=storefront-vps

      - name: Attest storefront image build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rad-storefront
          subject-digest: ${{ steps.storefront_build.outputs.digest }}
          push-to-registry: true

      - name: Build and push admin (linux/amd64)
        id: admin_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rad-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rad-admin:latest
          cache-from: type=gha,scope=admin-vps
          cache-to: type=gha,mode=max,scope=admin-vps

      - name: Attest admin image build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rad-admin
          subject-digest: ${{ steps.admin_build.outputs.digest }}
          push-to-registry: true

  # Runs on the dedicated `rad-production` SELF-HOSTED runner — it lives on
  # the VPS itself, so there is no inbound SSH left to fix: the runner polls
  # GitHub outbound (the same mechanism it already uses while Idle) and
  # these steps run as LOCAL commands. `build-images` above still runs on
  # ubuntu-latest, as does every PR/CI job (ci.yml never uses this label) —
  # untrusted PR code never touches `rad-production`. `rad-runner` (the
  # runner's service account) has no Docker socket access and no general
  # sudo rule; `docker compose pull`/`up` only ever runs through the single
  # fixed, root-owned, argument-validating wrapper script
  # (infra/rad-production-runner/rad-release-frontend.sh), invoked via a
  # sudoers rule scoped to exactly that one script. See
  # infra/rad-production-runner/README.md for the required one-time VPS
  # setup and docs/cicd-pipeline.md for the full migration/rollback plan.
  release:
    name: Pull & restart on VPS
    needs: [should-deploy, build-images]
    # should-deploy.outputs.any is the one reliable signal (see the
    # file-level note on why github.event_name can't be used here) — a
    # plain push to main (should-deploy.any == 'false') only builds+
    # publishes images above, it never deploys by itself; deploy.yml is
    # what decides whether to deploy, by calling this workflow with
    # workflow_call. This avoids two separate triggers (a raw push here,
    # and deploy.yml's own push trigger) both racing to deploy the same
    # commit.
    if: needs.should-deploy.outputs.any == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, rad-production]
    environment: production-frontend-vps
    # Marker file recording the last deploy that actually passed its health
    # check — the rollback target. Owned by rad-runner itself (not root):
    # it's advisory bookkeeping only, never trusted blindly — the sudo
    # wrapper re-validates any ref read from it against the same
    # digest-pinned-GHCR-image regex as a freshly-built ref before ever
    # touching Docker.
    env:
      LAST_HEALTHY_FILE: /opt/rad-releases/.last-healthy-frontend-refs.env
    steps:
      - name: Verify image build provenance before touching anything privileged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in \
            "${{ needs.should-deploy.outputs.storefront == 'true' && needs.build-images.outputs.storefront_ref || '' }}" \
            "${{ needs.should-deploy.outputs.admin == 'true' && needs.build-images.outputs.admin_ref || '' }}"; do
            [[ -z "$ref" ]] && continue
            echo "Verifying build provenance for ${ref} ..."
            gh attestation verify "oci://${ref}" \
              --repo "${{ github.repository }}" \
              --predicate-type https://slsa.dev/provenance/v1
          done
          echo "OK: build-provenance attestation verified for every image this run will deploy."
      # "avoid restarting unrelated healthy services" — compute which
      # compose service names actually need recreating from the caller's
      # deploy_storefront/deploy_admin inputs, once, reused by every later
      # step instead of unconditionally touching both containers.
      - name: Determine affected service(s)
        id: services
        run: |
          set -euo pipefail
          services=()
          [[ "${{ needs.should-deploy.outputs.storefront }}" == "true" ]] && services+=("storefront")
          [[ "${{ needs.should-deploy.outputs.admin }}" == "true" ]] && services+=("admin")
          if [[ ${#services[@]} -eq 0 ]]; then
            echo "::error::Neither deploy_storefront nor deploy_admin is true — nothing to deploy. This job should not have been called with both false."
            exit 1
          fi
          list="${services[*]}"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "Will deploy: ${list}"

      # The rollback target. Prefers the actually-running containers' own
      # image references (ground truth — reflects whatever is live right
      # now, whether or not it was ever recorded) and only falls back to
      # the recorded last-healthy-refs file, then to "-" (meaning: let the
      # compose file's own `:latest` default apply), when a container
      # doesn't exist yet (first-ever deploy on a fresh host). No secrets
      # in any of this — image refs are just GHCR digests, which are public
      # alongside the (public) images themselves.
      - name: Capture currently-running image refs (rollback target)
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          running_ref() {
            local container="$1" app="$2"
            local image
            image=$(docker inspect -f '{{.Config.Image}}' "$container" 2>/dev/null || true)
            if [[ -n "$image" && "$image" == *@sha256:* ]]; then
              echo "$image"
            else
              grep -oP "(?<=^${app}_IMAGE_REF=).*" "$LAST_HEALTHY_FILE" 2>/dev/null | tail -n1 || true
            fi
          }
          storefront_prev=$(running_ref rad-storefront STOREFRONT)
          admin_prev=$(running_ref rad-admin ADMIN)
          storefront_prev=${storefront_prev:--}
          admin_prev=${admin_prev:--}
          echo "storefront_ref=${storefront_prev}" >> "$GITHUB_OUTPUT"
          echo "admin_ref=${admin_prev}" >> "$GITHUB_OUTPUT"
          echo "Rollback target captured: storefront=${storefront_prev} admin=${admin_prev}"

      # The ONLY privileged step in the normal path. rad-runner has sudo
      # rights to run exactly this one root-owned script, which itself
      # re-validates both image refs are digest-pinned GHCR images and that
      # the service list is a subset of {storefront, admin} before ever
      # touching Docker — rad-runner itself holds no Docker socket access.
      - name: Pull new images and recreate containers (via scoped sudo wrapper)
        id: deploy
        env:
          STOREFRONT_IMAGE_REF: ${{ needs.should-deploy.outputs.storefront == 'true' && needs.build-images.outputs.storefront_ref || '-' }}
          ADMIN_IMAGE_REF: ${{ needs.should-deploy.outputs.admin == 'true' && needs.build-images.outputs.admin_ref || '-' }}
          SERVICES: ${{ steps.services.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/bin/rad-release-frontend.sh \
            "$STOREFRONT_IMAGE_REF" "$ADMIN_IMAGE_REF" "$SERVICES"

      # Covers both failure modes this step actually sees: a container that
      # never leaves "starting"/"unhealthy" (health check keeps failing) and
      # one that exits immediately (crash loop — `docker inspect` on a
      # removed/recreated container id still answers, but a dead container
      # never reports "healthy", so the same loop/timeout catches it too).
      # Only polls the container(s) actually touched this run — an
      # untouched, already-healthy sibling container is irrelevant here.
      # `docker inspect`/`ps` are read-only and safe for rad-runner itself
      # to run directly (no socket write capability is needed to read
      # state) — only mutating compose operations go through the sudo
      # wrapper above.
      - name: Verify containers healthy
        id: health
        env:
          SERVICES: ${{ steps.services.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          containers=()
          for s in $SERVICES; do containers+=("rad-${s}"); done
          expected="$(printf 'healthy %.0s' "${containers[@]}")"
          expected="${expected% }"
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "${containers[@]}" 2>/dev/null | tr '\n' ' ' | sed 's/ $//' || true)
            [[ "$status" == "$expected" ]] && exit 0
            sleep 5
          done
          echo "::error::New deploy (services=${SERVICES}) did not report healthy within timeout (last status: ${status:-<none>})."
          exit 1

      # "Pull new images and recreate containers" may die partway through a
      # multi-service deploy (e.g. pull succeeds but `up -d` only recreates
      # one of two services before erroring), leaving the host in a mixed
      # state — exactly the partial-deployment case a rollback must also
      # cover, not only "the container(s) came up but failed their health
      # check". Redeploying the previously-captured refs for the SAME
      # service(s) this run touched is safe and idempotent either way; an
      # untouched sibling service was never part of this deploy and is left
      # alone.
      - name: Roll back to last known-healthy images
        id: rollback
        if: failure()
        env:
          STOREFRONT_IMAGE_REF: ${{ steps.previous.outputs.storefront_ref }}
          ADMIN_IMAGE_REF: ${{ steps.previous.outputs.admin_ref }}
          SERVICES: ${{ steps.services.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Health check failed for the new deploy (services=${SERVICES}) — rolling back to storefront=${STOREFRONT_IMAGE_REF} admin=${ADMIN_IMAGE_REF}"
          sudo -n /usr/local/bin/rad-release-frontend.sh \
            "$STOREFRONT_IMAGE_REF" "$ADMIN_IMAGE_REF" "$SERVICES"
          containers=()
          for s in $SERVICES; do containers+=("rad-${s}"); done
          expected="$(printf 'healthy %.0s' "${containers[@]}")"
          expected="${expected% }"
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "${containers[@]}" 2>/dev/null | tr '\n' ' ' | sed 's/ $//' || true)
            if [[ "$status" == "$expected" ]]; then
              echo "::notice::Rollback verified healthy (services=${SERVICES}, storefront=${STOREFRONT_IMAGE_REF}, admin=${ADMIN_IMAGE_REF})."
              exit 0
            fi
            sleep 5
          done
          echo "::error::ROLLBACK ITSELF FAILED to report healthy. Manual intervention required on the VPS now — the frontend may be down or serving a broken deploy."
          exit 1

      # The container healthcheck above only confirms each container's own
      # /api/health responds from inside the VPS — this is an independent,
      # external, read-only check through the real public domain(s)/Nginx,
      # of the actual pages customers load, plus a cross-check that the API
      # compatibility (via /backend/session) and media aren't silently
      # broken. A failure here falls through to the same rollback step
      # above (it only checks job failure, not which prior step failed).
      - name: Smoke test (public endpoints, read-only)
        if: success()
        env:
          SERVICES: ${{ steps.services.outputs.list }}
          STOREFRONT_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.rad-object.com' }}
          ADMIN_URL: ${{ vars.ADMIN_SITE_URL || 'https://admin.rad-object.com' }}
        run: |
          set -euo pipefail
          check_page() {
            local url="$1" label="$2"
            local code
            code="$(curl -sS --max-time 15 --retry 3 --retry-delay 3 --retry-connrefused -o /tmp/page.html -w '%{http_code}' "$url")"
            if [[ "$code" != "200" ]]; then
              echo "::error::${label} (${url}) responded ${code}, expected 200."
              exit 1
            fi
            echo "OK: ${label} -> 200"
          }
          if [[ "$SERVICES" == *storefront* ]]; then
            check_page "${STOREFRONT_URL}/fa" "Storefront homepage"
            check_page "${STOREFRONT_URL}/fa/products" "Storefront PLP"
            # The /fa/products listing's page data is used instead of a
            # hardcoded slug, which would eventually go stale: pull the
            # first product link straight out of the PLP HTML we just
            # fetched above.
            pdp_path="$(grep -oE 'href="/fa/products/[a-z0-9-]+"' /tmp/page.html | head -n1 | sed -E 's/href="(.*)"/\1/' || true)"
            if [[ -n "$pdp_path" ]]; then
              check_page "${STOREFRONT_URL}${pdp_path}" "Storefront PDP (${pdp_path})"
            else
              echo "::warning::Could not find a product link on the PLP to smoke-test a PDP — skipping (not a failure by itself, but worth a look if this keeps happening)."
            fi
            echo "Checking ${STOREFRONT_URL}/backend/session (API compatibility through the storefront's own proxy; 200 or 401 both fine) ..."
            session_code="$(curl -sS --max-time 15 --retry 3 --retry-delay 3 --retry-connrefused -o /dev/null -w '%{http_code}' "${STOREFRONT_URL}/backend/session")"
            if [[ "$session_code" != "200" && "$session_code" != "401" ]]; then
              echo "::error::/backend/session responded ${session_code}, expected 200 or 401 — the storefront may not be able to reach the API."
              exit 1
            fi
            echo "OK: /backend/session -> ${session_code}"
          fi
          if [[ "$SERVICES" == *admin* ]]; then
            check_page "${ADMIN_URL}/login" "Admin login page"
          fi

      # Runs on the success path too, so the rollback target for the NEXT
      # deploy always reflects the most recently verified-healthy refs —
      # never the refs "currently running" at the start of this job, which
      # this run just replaced.
      - name: Record this deploy as last known-healthy
        if: success()
        env:
          STOREFRONT_IMAGE_REF: ${{ needs.should-deploy.outputs.storefront == 'true' && needs.build-images.outputs.storefront_ref || steps.previous.outputs.storefront_ref }}
          ADMIN_IMAGE_REF: ${{ needs.should-deploy.outputs.admin == 'true' && needs.build-images.outputs.admin_ref || steps.previous.outputs.admin_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$LAST_HEALTHY_FILE" <<EOF
          STOREFRONT_IMAGE_REF=${STOREFRONT_IMAGE_REF}
          ADMIN_IMAGE_REF=${ADMIN_IMAGE_REF}
          EOF

      - name: Report deploy outcome
        if: always()
        run: |
          if [[ "${{ steps.rollback.outcome }}" == "success" ]]; then
            echo "::warning::Deploy of storefront=${{ needs.build-images.outputs.storefront_ref }} admin=${{ needs.build-images.outputs.admin_ref }} FAILED health checks and was AUTOMATICALLY ROLLED BACK to storefront=${{ steps.previous.outputs.storefront_ref }} admin=${{ steps.previous.outputs.admin_ref }}. Production is back on the previous known-healthy release; investigate the failed images before retrying."
          elif [[ "${{ steps.rollback.outcome }}" == "failure" ]]; then
            echo "::error::Deploy FAILED and the automatic ROLLBACK ALSO FAILED. Production may be in a broken or unknown state. Log in to the VPS directly and check 'docker compose -f docker-compose.frontend-vps.yml ps'."
          elif [[ "${{ steps.health.outcome }}" == "success" ]]; then
            echo "Deploy succeeded: storefront=${{ needs.build-images.outputs.storefront_ref }} admin=${{ needs.build-images.outputs.admin_ref }}, both containers healthy."
          fi

  # Independent of whatever the `release` job's own `if:` condition
  # concluded — catches a reusable-workflow trigger condition that
  # silently evaluates false (so `release` shows as "skipped", which does
  # NOT fail a workflow run by default) when a deploy genuinely should
  # have happened. Recomputes "should this have deployed" from the same
  # should-deploy output and fails loudly if release's result disagrees.
  verify-outcome:
    name: Verify a required deploy actually ran
    needs: [should-deploy, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          should="${{ needs.should-deploy.outputs.any }}"
          result="${{ needs.release.result }}"
          echo "should-deploy.any=${should} release.result=${result}"
          if [[ "$should" == "true" && "$result" != "success" ]]; then
            echo "::error::A deploy was required (should-deploy.any=true) but the release job's result was '${result}', not 'success'. This must never be silently reported as a successful deployment — investigate the release job's conditions and logs."
            exit 1
          fi
          echo "OK: release outcome matches what was required."
