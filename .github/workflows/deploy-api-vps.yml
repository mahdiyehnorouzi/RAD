# Builds/signs on GitHub-hosted infrastructure; production only consumes verified output.
#
# Release transport: GitHub-hosted `ubuntu-latest` (never self-hosted - that
# path is stopped/disabled, see docs/vps-tailscale-ssh-deploy.md) joins the
# RAD tailnet over GitHub OIDC (tailscale/github-action@v4, no long-lived
# Tailscale credential in this repo) and reaches the VPS at its private
# Tailscale address only. It authenticates as the narrowly-restricted
# `rad-deploy` account (forced SSH command, no shell, no arbitrary remote
# commands - see scripts/production/rad-deploy-ssh-entrypoint.sh) and pins
# the VPS host key via RAD_VPS_SSH_HOST_KEY. The actual release, health
# check, and rollback logic is scripts/production/rad_release.py.
#
# `migrate` (below) runs before `release` and applies any pending
# migrations this exact signed artifact ships - checked against the live
# database's own migration history, backed up first, under the same broker
# lock as every release - so the API this job releases next never starts
# against a database it expects but that doesn't exist yet. See
# docs/automated-migrations.md for the one-time operator approval this
# requires and what it does and doesn't automate.
name: API VPS release
on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to release the selected main commit"
        required: true
        default: build-check-only
      commit_sha:
        description: "Full SHA; must equal this main workflow run's commit"
        required: true
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.commit_sha == github.sha
    uses: ./.github/workflows/ci.yml
  build-artifact:
    needs: checks
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.commit_sha == github.sha && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse a stale main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/mahdiyehnorouzi/RAD/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @rad/api
      - run: npm prune --omit=dev
      - run: bash scripts/production/package-api.sh
      - name: Bind artifact digest to this exact source and run
        env:
          RELEASE_KIND: api
        run: python3 scripts/production/make-manifest.py
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        id: attest
        with:
          subject-path: release.json
      - run: cp "$BUNDLE" release.sigstore.json
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            api-release.tar.gz
            release.json
            release.sigstore.json
          if-no-files-found: error
          retention-days: 7

  # Applies any migrations this exact artifact ships before the API that
  # depends on them is ever started - see docs/automated-migrations.md.
  # Reuses the same signed artifact/manifest `release` ships below (no
  # second build, no second signing) and the same tailnet/SSH transport;
  # only the forced-command verb differs ("migrate" vs "deploy kind=api").
  # A deployment whose artifact has no pending migrations is a fast no-op
  # here (the broker checks the live database's own migration history
  # before doing anything else) - most releases never touch the backup/
  # migration-lock path at all.
  migrate:
    name: Apply pending migrations
    needs: build-artifact
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.commit_sha == github.sha && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-api-vps
    permissions:
      contents: read
      id-token: write
    # Same group as `release` below: a migrate and a release (this run's or
    # any other's) never run concurrently against the host, and this job
    # always finishes (or fails) before `release` can start, by `needs:`.
    concurrency:
      group: rad-production-release
      cancel-in-progress: false
    env:
      RAD_VPS_TAILSCALE_IP: "100.103.104.79"
    steps:
      - name: Download signed artifact (this exact run/attempt only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: api-release-${{ github.sha }}-${{ github.run_attempt }}
          path: stage

      - name: Connect to RAD tailnet using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:rad-deploy

      - name: Configure pinned SSH identity for the restricted rad-deploy account
        env:
          SSH_KEY: ${{ secrets.RAD_DEPLOY_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.RAD_VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$HOST_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s %s\n' "$RAD_VPS_TAILSCALE_IP" "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      # Same trust boundary as the `release` job's "Ship artifact and
      # trigger release" step below: this account can run nothing but the
      # fixed forced command, which hands the request to the unchanged
      # root-owned broker. If this artifact's migrations require operator
      # approval that hasn't been granted yet (activation policy's
      # `migrations_verified` is not true), the broker refuses and this
      # step - and therefore this job and `release`, which needs it - fails
      # closed rather than deploying API code against an un-migrated
      # database.
      - name: Ship artifact and trigger migration check over the tailnet
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          tar -cf - -C stage release.json release.sigstore.json api-release.tar.gz \
            | ssh "${ssh_args[@]}" "rad-deploy@${RAD_VPS_TAILSCALE_IP}" \
              "migrate commit=${GITHUB_SHA} run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT}"

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  release:
    needs: [build-artifact, migrate]
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.commit_sha == github.sha && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'deploy') && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-api-vps
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: rad-production-release
      cancel-in-progress: false
    env:
      RAD_VPS_TAILSCALE_IP: "100.103.104.79"
    steps:
      - name: Download signed artifact (this exact run/attempt only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: api-release-${{ github.sha }}-${{ github.run_attempt }}
          path: stage

      - name: Connect to RAD tailnet using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:rad-deploy

      - name: Configure pinned SSH identity for the restricted rad-deploy account
        env:
          SSH_KEY: ${{ secrets.RAD_DEPLOY_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.RAD_VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$HOST_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s %s\n' "$RAD_VPS_TAILSCALE_IP" "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      # The only thing this step does is get the signed artifact + a fixed-grammar
      # trigger string onto the VPS over the tailnet, as the `rad-deploy` account,
      # whose SSH key can run exactly one forced command
      # (scripts/production/rad-deploy-ssh-entrypoint.sh) and nothing else - no
      # shell, no other remote command, no root key. That entrypoint hands the
      # request to the exact same root-owned broker
      # (scripts/production/rad_release.py) the self-hosted-runner design used,
      # unchanged, which performs the real verification, release, health check
      # and rollback. A broker rejection (health check failure, activation not
      # enabled, manifest mismatch, etc.) makes this ssh command exit non-zero,
      # which fails this step and this job - never a silent skip.
      - name: Ship artifact and trigger release over the tailnet
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          tar -cf - -C stage release.json release.sigstore.json api-release.tar.gz \
            | ssh "${ssh_args[@]}" "rad-deploy@${RAD_VPS_TAILSCALE_IP}" \
              "deploy kind=api commit=${GITHUB_SHA} run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT}"

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  verify-outcome:
    needs: [checks, build-artifact, migrate, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on rejected, skipped or unsuccessful requested release
        env:
          TRUSTED: ${{ github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && inputs.commit_sha == github.sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm == 'deploy' }}
          CHECKS: ${{ needs.checks.result }}
          MIGRATE: ${{ needs.migrate.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          test "$TRUSTED" = true
          test "$CHECKS" = success
          if test "$REQUESTED" = true; then test "$MIGRATE" = success; test "$RELEASE" = success; fi
