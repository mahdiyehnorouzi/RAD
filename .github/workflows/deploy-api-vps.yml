# Builds/signs on GitHub-hosted infrastructure; production only consumes verified output.
name: API VPS release
on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to release the selected main commit"
        required: true
        default: build-check-only
      commit_sha:
        description: "Full SHA; must equal this main workflow run's commit"
        required: true
permissions:
  contents: read
jobs:
  checks:
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.commit_sha == github.sha
    uses: ./.github/workflows/ci.yml
  build-artifact:
    needs: checks
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.commit_sha == github.sha && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse a stale main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/mahdiyehnorouzi/RAD/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @rad/api
      - run: npm prune --omit=dev
      - run: bash scripts/production/package-api.sh
      - name: Bind artifact digest to this exact source and run
        env:
          RELEASE_KIND: api
        run: python3 scripts/production/make-manifest.py
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        id: attest
        with:
          subject-path: release.json
      - run: cp "$BUNDLE" release.sigstore.json
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            api-release.tar.gz
            release.json
            release.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build-artifact
    if: vars.RAD_SELF_HOSTED_RELEASE_ENABLED == 'true' && github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.commit_sha == github.sha && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'deploy')
    runs-on: [self-hosted, Linux, X64, rad-production]
    timeout-minutes: 20
    environment: production-api-vps
    permissions:
      contents: read
      actions: read
    concurrency:
      group: rad-production-release
      cancel-in-progress: false
    steps:
      # Deliberately no checkout, setup-node, shell from artifacts, SSH or Docker.
      - name: Allocate incoming data directory
        id: stage
        run: |
          set -euo pipefail
          stage=$(mktemp -d /var/lib/rad-release/incoming/release-XXXXXXXXXXXX)
          echo "path=$stage" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: api-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.stage.outputs.path }}
      - name: Invoke installed root-owned verifier and release broker
        env:
          STAGE: ${{ steps.stage.outputs.path }}
          RELEASE_KIND: api
        run: |
          set -euo pipefail
          # Only fixed-format data crosses the privilege boundary. The root-owned
          # broker independently verifies the signed manifest, source SHA/ref,
          # hosted builder, run identity, payload digest and allowed operations.
          python3 - <<'PY_REQUEST' | sudo -n /usr/local/sbin/rad-release
          import json, os
          print(json.dumps(dict(stage=os.path.basename(os.environ["STAGE"]),
            kind=os.environ["RELEASE_KIND"], commit=os.environ["GITHUB_SHA"],
            run_id=int(os.environ["GITHUB_RUN_ID"]), run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]))))
          PY_REQUEST
      - name: Remove incoming data
        if: always() && steps.stage.outcome == 'success'
        env:
          STAGE: ${{ steps.stage.outputs.path }}
        run: |
          case "$STAGE" in /var/lib/rad-release/incoming/release-*) rm -rf -- "$STAGE" ;; *) exit 1 ;; esac

  verify-outcome:
    needs: [checks, build-artifact, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on rejected, skipped or unsuccessful requested release
        env:
          TRUSTED: ${{ github.repository == 'mahdiyehnorouzi/RAD' && github.ref == 'refs/heads/main' && inputs.commit_sha == github.sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm == 'deploy' }}
          CHECKS: ${{ needs.checks.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          test "$TRUSTED" = true
          test "$CHECKS" = success
          if test "$REQUESTED" = true; then test "$RELEASE" = success; fi
