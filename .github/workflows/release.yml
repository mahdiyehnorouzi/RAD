name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy tagged version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches VERSION
        run: |
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$FILE" ]]; then
              echo "Tag v${TAG} does not match VERSION file ${FILE}"
              exit 1
            fi
          fi
          echo "RAD_VERSION=${FILE}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Check deploy secrets
        env:
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' || vars.RAILWAY_TOKEN != '' }}
          HAS_RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN != '' }}
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "RAILWAY_TOKEN present: ${HAS_RAILWAY_TOKEN}"
          echo "RAILWAY_API_TOKEN present: ${HAS_RAILWAY_API_TOKEN}"
          echo "CLOUDFLARE_API_TOKEN present: ${HAS_CLOUDFLARE}"
          if [[ "${HAS_RAILWAY_TOKEN}" != "true" && "${HAS_RAILWAY_API_TOKEN}" != "true" ]]; then
            echo "::error::No Railway credential reached this job. Need RAILWAY_TOKEN (project token) or RAILWAY_API_TOKEN (account token) as a Repository secret."
            exit 1
          fi

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || vars.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || 'rad-api-web' }}
        run: bash scripts/deploy-api-railway.sh

      - name: Deploy storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://rad-api-web-production-9b7c.up.railway.app' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID || vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: bash scripts/deploy-storefront-cloudflare.sh

      - name: Deploy admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://rad-api-web-production-9b7c.up.railway.app' }}
        run: bash scripts/deploy-admin-cloudflare.sh
