name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    name: Deploy tagged version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "$FILE" ]]; then
            echo "Tag v${TAG} does not match VERSION file ${FILE}"
            exit 1
          fi
          echo "RAD_VERSION=${FILE}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || 'rad-api-web' }}
        run: bash scripts/deploy-api-railway.sh

      - name: Deploy storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://rad-api-web-production-9b7c.up.railway.app' }}
        run: bash scripts/deploy-storefront-cloudflare.sh

      - name: Deploy admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://rad-api-web-production-9b7c.up.railway.app' }}
        run: bash scripts/deploy-admin-cloudflare.sh
