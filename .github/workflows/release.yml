name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy tagged version
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches VERSION
        run: |
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$FILE" ]]; then
              echo "Tag v${TAG} does not match VERSION file ${FILE}"
              exit 1
            fi
          fi
          echo "RAD_VERSION=${FILE}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Check deploy secrets
        env:
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN present: ${HAS_CLOUDFLARE}"
          if [[ "${HAS_CLOUDFLARE}" != "true" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it as a Repository secret."
            exit 1
          fi

      - name: Deploy storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://api.rad-object.com' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID || vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: bash scripts/deploy-storefront-cloudflare.sh

      - name: Deploy admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_URL: ${{ vars.API_URL || 'https://api.rad-object.com' }}
        run: bash scripts/deploy-admin-cloudflare.sh
