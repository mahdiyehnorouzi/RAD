# RAD-129: the single entry point for a Production release, and the ONLY
# place that releases to Production - deploy-api-vps.yml and
# deploy-frontend-vps.yml only release when called from here (or, for a
# human-triggered emergency redeploy, via their own workflow_dispatch - see
# docs/cicd-pipeline.md).
#
# Merging a PR into `main` does NOT deploy anything by itself. A push to
# `main` has no trigger here or anywhere else in this repo (there is no
# `on: push` left in this file). Releasing to Production is always a
# separate, explicit, human action: pick an exact commit SHA (normally one
# already on `main`), come to this workflow, and type `deploy` into
# `confirm`. Leaving `confirm` at its default (`build-check-only`) still
# runs `preflight` (the commit's presence on `main`, its passing "CI
# passed" check) and `detect` (which services it would affect), but never
# enters deploy-api-vps.yml's / deploy-frontend-vps.yml's own build/release
# jobs - those two workflows already require `confirm: deploy` before
# building or shipping anything, on this path exactly as on their own
# direct `workflow_dispatch`. This is the safe dry-run path for validating
# a SHA before actually releasing it.
#
# Flow: verify the requested commit (preflight - on `main`, CI passed for
# that exact SHA), work out which of api/storefront/admin it actually
# touched relative to its parent commit (dependency-aware: a shared package
# used by several apps affects all of them, not just the one whose path a
# naive filter would match), then release API first (if affected) and only
# once that finishes successfully, the frontend (if affected) - never the
# two racing each other, and never an older run clobbering a newer one (the
# concurrency group + each sub-workflow's own group serialize this per
# target).
#
# This workflow deploys. It does not decide whether the code is good enough
# to deploy on its own - the "CI passed" check (recorded against the
# requested commit when its PR ran ci.yml, and re-verified here by
# `preflight`, not re-run blind against whatever ref this workflow happens
# to be dispatched from) is what blocks a broken commit from reaching any
# of this. Required migration approvals, the release broker's own
# verification, health checks, smoke tests and automatic rollback are
# unchanged - see deploy-api-vps.yml / deploy-frontend-vps.yml /
# docs/automated-migrations.md.

name: Production release (manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character SHA to release; must already be on main with a passing CI passed check"
        required: true
      confirm:
        description: "Type deploy to actually release; anything else runs every check as a dry run only"
        required: true
        default: build-check-only

concurrency:
  group: rad-deploy-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the requested commit
    if: github.repository == 'mahdiyehnorouzi/RAD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # verify-commit reads the requested commit's check runs
      # (gh api repos/.../commits/<sha>/check-runs) to confirm "CI passed"
      # actually succeeded for that exact SHA, and - since a "Merge pull
      # request" commit on main never has check runs of its own, only the
      # PR's head commit does - may also look up the merged PR for that
      # commit (gh api repos/.../commits/<sha>/pulls) to find that head
      # commit to check instead.
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Requested commit must be on main with a passing CI passed check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          node scripts/production/release-gate.mjs verify-commit \
            --repo mahdiyehnorouzi/RAD \
            --commit-sha "$COMMIT_SHA" \
            --required-check "CI passed"

      - name: Report mode
        run: |
          if [[ "${{ inputs.confirm }}" == "deploy" ]]; then
            echo "::notice::Releasing ${{ inputs.commit_sha }} to Production."
          else
            echo "::notice::Dry run only (confirm=${{ inputs.confirm }}) - verifying ${{ inputs.commit_sha }}, nothing will be released."
          fi

  detect:
    name: Detect affected services
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      storefront: ${{ steps.filter.outputs.storefront }}
      admin: ${{ steps.filter.outputs.admin }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed files since the commit's parent
        run: git diff --name-only "${{ inputs.commit_sha }}~1" "${{ inputs.commit_sha }}" > /tmp/changed-files.txt

      # See scripts/production/release-gate.mjs (release-gate.spec.mjs has
      # the committed test coverage for this mapping) for the dependency map
      # this mirrors - also documented in docs/cicd-pipeline.md.
      - name: Map changed files to affected services
        id: filter
        run: |
          set -euo pipefail
          node scripts/production/release-gate.mjs affected-services --changed-files /tmp/changed-files.txt | tee -a "$GITHUB_OUTPUT"

  # API first. Frontend consumes the API's response shape; releasing it
  # first and verifying it (deploy-api-vps.yml's own health check + public
  # smoke test) before touching the frontend means a frontend deploy never
  # goes out against an API that's mid-rollback or unhealthy.
  deploy-api:
    name: Deploy API
    needs: detect
    if: needs.detect.outputs.api == 'true'
    uses: ./.github/workflows/deploy-api-vps.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      confirm: ${{ inputs.confirm }}
    # Without this, a reusable workflow call receives NONE of the caller's
    # repository or Environment secrets - deploy-api-vps.yml's own
    # `secrets.TS_OAUTH_CLIENT_ID` / `secrets.TS_AUDIENCE` /
    # `secrets.RAD_DEPLOY_SSH_PRIVATE_KEY` / `secrets.RAD_VPS_SSH_HOST_KEY`
    # would all read as empty strings when invoked from here.
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read

  deploy-frontend:
    name: Deploy Storefront/Admin
    needs: [detect, deploy-api]
    # Runs when storefront and/or admin is affected, and only after the API
    # deploy has either succeeded or wasn't needed at all - never after a
    # failed API deploy (an unhealthy/rolled-back API is not something to
    # build a frontend release on top of; investigate the API failure
    # first, then re-dispatch this workflow once it's fixed).
    if: |
      always() && !cancelled() && needs.detect.result == 'success' &&
      (needs.detect.outputs.storefront == 'true' || needs.detect.outputs.admin == 'true') &&
      (needs.detect.outputs.api != 'true' || needs.deploy-api.result == 'success')
    uses: ./.github/workflows/deploy-frontend-vps.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      confirm: ${{ inputs.confirm }}
      deploy_storefront: ${{ needs.detect.outputs.storefront == 'true' }}
      deploy_admin: ${{ needs.detect.outputs.admin == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read

  summary:
    name: Release summary
    needs: [detect, deploy-api, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "## Release summary for ${{ inputs.commit_sha }} (confirm=${{ inputs.confirm }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Affected | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | ${{ needs.detect.outputs.api }} | ${{ needs.deploy-api.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Storefront/Admin | ${{ needs.detect.outputs.storefront }}/${{ needs.detect.outputs.admin }} | ${{ needs.deploy-frontend.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.deploy-api.result }}" == "failure" || "${{ needs.deploy-frontend.result }}" == "failure" ]]; then
            echo "::error::One or more deployments failed. Check the linked job logs above - each release job reports whether its own automatic rollback succeeded."
            exit 1
          fi
