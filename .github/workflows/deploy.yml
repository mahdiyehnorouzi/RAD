# Production release entry point: merging to main deploys the changed services automatically.
# deploy-api-vps.yml and deploy-frontend-vps.yml are called here after a push to main;
# each also retains workflow_dispatch for an explicit single-service recovery/re-release.
# The push path deploys the exact pushed commit after verifying the merged PR's passing CI,
# detects affected services, then deploys API first and the frontend only after API succeeds.
# Manual dispatch remains available for a selected main commit; its default is build-check-only,
# and typing deploy explicitly starts a release.
#
# Existing release broker verification, migration approvals, signing/attestation, health checks,
# smoke tests, serialization, and automatic rollback remain in force.

name: Production release (automatic on main; manual dispatch)

permissions:
  contents: read
  checks: read
  pull-requests: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character SHA to release; must already be on main with a passing CI passed check"
        required: true
      confirm:
        description: "Type deploy to actually release; anything else runs every check as a dry run only"
        required: true
        default: build-check-only

concurrency:
  group: rad-deploy-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the requested commit
    if: github.repository == 'mahdiyehnorouzi/RAD'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # verify-commit reads the requested commit's check runs
      # (gh api repos/.../commits/<sha>/check-runs) to confirm "CI passed"
      # actually succeeded for that exact SHA, and - since a "Merge pull
      # request" commit on main never has check runs of its own, only the
      # PR's head commit does - may also look up the merged PR for that
      # commit (gh api repos/.../commits/<sha>/pulls) to find that head
      # commit to check instead.
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Requested commit must be on main with a passing CI passed check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.inputs.commit_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          node scripts/production/release-gate.mjs verify-commit \
            --repo mahdiyehnorouzi/RAD \
            --commit-sha "$COMMIT_SHA" \
            --required-check "CI passed"

      - name: Report mode
        env:
          COMMIT_SHA: ${{ github.event.inputs.commit_sha || github.sha }}
          CONFIRM_MODE: ${{ github.event.inputs.confirm || (github.event_name == 'push' && 'deploy') || 'build-check-only' }}
        run: |
          if [[ "$CONFIRM_MODE" == "deploy" ]]; then
            echo "::notice::Releasing $COMMIT_SHA to Production."
          else
            echo "::notice::Dry run only (confirm=$CONFIRM_MODE) - verifying $COMMIT_SHA, nothing will be released."
          fi

  checks:
    name: CI on the pushed main commit
    if: github.repository == 'mahdiyehnorouzi/RAD' && github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  detect:
    name: Detect affected services
    needs: [preflight, checks]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (github.event_name != 'push' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      storefront: ${{ steps.filter.outputs.storefront }}
      admin: ${{ steps.filter.outputs.admin }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed files for this push or selected commit
        env:
          COMMIT_SHA: ${{ github.event.inputs.commit_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            before="$EVENT_BEFORE"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]] \
               || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "::warning::Could not safely diff against the previous main commit (before=${before:-<empty>}) - treating every path as changed."
              git ls-files > /tmp/changed-files.txt
            else
              git diff --name-only "$before" "$COMMIT_SHA" > /tmp/changed-files.txt
            fi
          else
            git diff --name-only "${COMMIT_SHA}~1" "$COMMIT_SHA" > /tmp/changed-files.txt
          fi

      # See scripts/production/release-gate.mjs (release-gate.spec.mjs has
      # the committed test coverage for this mapping) for the dependency map
      # this mirrors - also documented in docs/cicd-pipeline.md.
      - name: Map changed files to affected services
        id: filter
        run: |
          set -euo pipefail
          node scripts/production/release-gate.mjs affected-services --changed-files /tmp/changed-files.txt | tee -a "$GITHUB_OUTPUT"

  # API first. Frontend consumes the API's response shape; releasing it
  # first and verifying it (deploy-api-vps.yml's own health check + public
  # smoke test) before touching the frontend means a frontend deploy never
  # goes out against an API that's mid-rollback or unhealthy.
  deploy-api:
    name: Deploy API
    needs: detect
    if: needs.detect.outputs.api == 'true'
    uses: ./.github/workflows/deploy-api-vps.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}
      confirm: ${{ github.event.inputs.confirm || (github.event_name == 'push' && 'deploy') || 'build-check-only' }}
    # Without this, a reusable workflow call receives NONE of the caller's
    # repository or Environment secrets - deploy-api-vps.yml's own
    # `secrets.TS_OAUTH_CLIENT_ID` / `secrets.TS_AUDIENCE` /
    # `secrets.RAD_DEPLOY_SSH_PRIVATE_KEY` / `secrets.RAD_VPS_SSH_HOST_KEY`
    # would all read as empty strings when invoked from here.
    secrets: inherit
    permissions:
      contents: read
      checks: read
      pull-requests: read
      id-token: write
      attestations: write
      actions: read

  deploy-frontend:
    name: Deploy Storefront/Admin
    needs: [detect, deploy-api]
    # Runs when storefront and/or admin is affected, and only after the API
    # deploy has either succeeded or wasn't needed at all - never after a
    # failed API deploy (an unhealthy/rolled-back API is not something to
    # build a frontend release on top of; investigate the API failure
    # first, then re-dispatch this workflow once it's fixed).
    if: |
      always() && !cancelled() && needs.detect.result == 'success' &&
      (needs.detect.outputs.storefront == 'true' || needs.detect.outputs.admin == 'true') &&
      (needs.detect.outputs.api != 'true' || needs.deploy-api.result == 'success')
    uses: ./.github/workflows/deploy-frontend-vps.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}
      confirm: ${{ github.event.inputs.confirm || (github.event_name == 'push' && 'deploy') || 'build-check-only' }}
      deploy_storefront: ${{ needs.detect.outputs.storefront == 'true' }}
      deploy_admin: ${{ needs.detect.outputs.admin == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      checks: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
      actions: read

  summary:
    name: Release summary
    needs: [detect, deploy-api, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "## Release summary for ${{ github.event.inputs.commit_sha || github.sha }} (confirm=${{ github.event.inputs.confirm || (github.event_name == 'push' && 'deploy') || 'build-check-only' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Affected | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | ${{ needs.detect.outputs.api }} | ${{ needs.deploy-api.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Storefront/Admin | ${{ needs.detect.outputs.storefront }}/${{ needs.detect.outputs.admin }} | ${{ needs.deploy-frontend.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.deploy-api.result }}" == "failure" || "${{ needs.deploy-frontend.result }}" == "failure" ]]; then
            echo "::error::One or more deployments failed. Check the linked job logs above - each release job reports whether its own automatic rollback succeeded."
            exit 1
          fi
