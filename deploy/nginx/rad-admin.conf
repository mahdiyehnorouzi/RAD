# Reference Nginx config for admin.rad-object.com -> the admin container
# on the VPS. NOT applied by anything automatically. Same install steps as
# rad-storefront.conf (certbot -d admin.rad-object.com).
#
# Admin is staff-only: no public caching anywhere, and it's worth
# restricting by IP/VPN at this layer in addition to app-level auth once
# that's defined (not assumed here).

server {
    listen 80;
    listen [::]:80;
    server_name admin.rad-object.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://admin.rad-object.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.rad-object.com;

    ssl_certificate     /etc/letsencrypt/live/admin.rad-object.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.rad-object.com/privkey.pem;

    client_max_body_size 12m;

    # nginx only inherits add_header from the parent context when the
    # current block defines none of its own — since both locations below
    # set their own Cache-Control, these four must be repeated in each
    # location rather than left here, or they'd silently disappear.

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
}
