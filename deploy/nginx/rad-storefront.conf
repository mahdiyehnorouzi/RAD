# Reference Nginx config for rad-object.com + www.rad-object.com -> the
# storefront container on the VPS. NOT applied by anything automatically.
#
# Manual install on the VPS:
#   1. Copy to /etc/nginx/sites-available/rad-storefront
#   2. ln -s /etc/nginx/sites-available/rad-storefront /etc/nginx/sites-enabled/
#   3. Obtain certs (certbot --nginx -d rad-object.com -d www.rad-object.com)
#   4. nginx -t   (MUST pass before reload)
#   5. systemctl reload nginx
#
# Does not touch /etc/nginx/sites-enabled/rad-api (the existing, verified
# API config) or any other existing server block.

# Canonical redirect: apex -> www (matches the frontend's own host
# canonicalization logic already in apps/storefront/next.config.mjs).
server {
    listen 80;
    listen [::]:80;
    server_name rad-object.com www.rad-object.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.rad-object.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rad-object.com;

    ssl_certificate     /etc/letsencrypt/live/rad-object.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rad-object.com/privkey.pem;

    return 301 https://www.rad-object.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rad-object.com;

    ssl_certificate     /etc/letsencrypt/live/rad-object.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rad-object.com/privkey.pem;

    client_max_body_size 12m;

    # nginx only inherits add_header from the parent context when the
    # current block defines none of its own — since both locations below
    # set their own Cache-Control, these three must be repeated in each
    # location rather than left here, or they'd silently disappear.

    # Immutable Next.js build assets: safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The on-demand image optimizer. It already sets its own correct
    # Cache-Control (driven by next.config's images.minimumCacheTTL) on
    # every response it returns — the blanket `no-store` the catch-all
    # below applies to everything else was overriding that, so neither the
    # browser nor any later request could ever reuse a resized image and
    # every single page view re-ran the full resize/encode from scratch.
    # No add_header override here: let the upstream's own header through.
    # Same proxy/security headers as location / below, minus the
    # Upgrade/Connection pair (this route is a plain GET, never a
    # websocket upgrade) — kept at parity otherwise.
    location /_next/image {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else (pages, API routes, RSC payloads) is per-request /
    # auth-sensitive: never cache.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }
}
