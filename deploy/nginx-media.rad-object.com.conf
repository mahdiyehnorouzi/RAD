# Draft Nginx config for media.rad-object.com — NOT applied by any script.
# Review and install manually on the VPS (typically /etc/nginx/sites-available/
# with a symlink in sites-enabled/), then `nginx -t && systemctl reload nginx`.
# Obtain the certificate first: certbot --nginx -d media.rad-object.com
#
# Purpose: expose ONLY the public bucket's object-read path over HTTPS,
# proxying to the SeaweedFS S3 gateway bound to 127.0.0.1:8333 — never
# expose 8333 itself, the master/volume/filer ports, or any admin
# interface to the internet. Presigned PUT uploads also go through this
# same host (S3_PUBLIC_ENDPOINT in apps/api/.env), since SigV4 presigned
# URLs are query-string based and work fine proxied like this; this file
# does not special-case the PUT method, it is already covered below.
#
# This does NOT make the bucket itself anonymously readable at the
# SeaweedFS/S3 level — requests still carry whatever auth the client
# included (none, for a plain GET of a public object SeaweedFS is
# configured to serve anonymously for the public bucket only; a valid
# SigV4 signature, for the presigned PUT uploads). If rad-public is not
# already configured for anonymous GET at the SeaweedFS/filer level,
# object reads will 403 here exactly as they would hitting 8333 directly
# — this config does not change that authorization, only exposes the
# port safely. rad-private must NEVER be reachable through this host.

server {
    listen 80;
    listen [::]:80;
    server_name media.rad-object.com;
    # certbot's --nginx plugin rewrites this block to redirect to :443
    # once the certificate exists; left as plain HTTP until then.
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media.rad-object.com;

    # Filled in by certbot --nginx -d media.rad-object.com:
    # ssl_certificate     /etc/letsencrypt/live/media.rad-object.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/media.rad-object.com/privkey.pem;

    client_max_body_size 110m; # PRODUCT_VIDEO_MAX_MB (default 50) + headroom; keep in sync if that env var changes

    # CORS for the admin panel's presigned browser uploads. Scope this to
    # the real admin origin only — never "*" on a host that also accepts
    # authenticated-by-URL PUT requests.
    set $cors_origin "";
    if ($http_origin = "https://admin.rad-object.com") {
        set $cors_origin $http_origin;
    }

    location / {
        proxy_pass http://127.0.0.1:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for presigned PUT uploads and for video Range requests
        # (seeking) on GET — do not buffer either direction.
        proxy_request_buffering off;
        proxy_buffering off;

        # HTTP Range passthrough for video streaming/seeking.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Content-Length 0;
            return 204;
        }

        # Long-lived caching for GETs only — an upload PUT must never be cached.
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Defense in depth: explicitly 404 anything that looks like an admin
    # or non-public-bucket path, in case SeaweedFS's own authorization
    # is ever misconfigured. Adjust the bucket name here if it changes.
    location ~ ^/(rad-private|_admin|cluster) {
        return 404;
    }
}
